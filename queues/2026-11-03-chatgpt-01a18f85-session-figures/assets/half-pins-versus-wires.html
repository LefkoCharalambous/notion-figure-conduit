<div id="fixator-motion-comparison">
  <style>
    #fixator-motion-comparison { color: var(--foreground); width: 100%; max-width: 736px; }
    #fixator-motion-comparison .load-control { max-width: 28rem; margin-bottom: 0.75rem; }
    #fixator-motion-comparison .load-label { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 0.4rem; }
    #fixator-motion-comparison .motion-drawing { display: block; width: 100%; overflow: visible; }
    #fixator-motion-comparison .motion-drawing text { fill: var(--foreground); font: inherit; font-weight: 400; }
    #fixator-motion-comparison .motion-drawing .panel-title { font-weight: 500; }
    #fixator-motion-comparison .motion-drawing .secondary-label { fill: var(--muted-foreground); }
    #fixator-motion-comparison .motion-drawing .bone { fill: var(--muted); stroke: var(--foreground); stroke-width: 1.5; }
    #fixator-motion-comparison .motion-drawing .structure { fill: none; stroke: var(--foreground); stroke-width: 1.5; }
    #fixator-motion-comparison .motion-drawing .reference { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 4 4; }
    #fixator-motion-comparison .motion-drawing .force { fill: none; stroke: var(--foreground); stroke-width: 2; }
    #fixator-motion-comparison .motion-drawing .axial { fill: none; stroke: var(--viz-series-1); stroke-width: 2; }
    #fixator-motion-comparison .motion-drawing .shear { fill: none; stroke: var(--viz-series-2); stroke-width: 2; }
    #fixator-motion-comparison .motion-drawing .wire { fill: none; stroke: var(--foreground); stroke-width: 2; }
    #fixator-motion-comparison .motion-drawing .pin { fill: none; stroke: var(--foreground); stroke-width: 6; stroke-linecap: round; }
    #fixator-motion-comparison .motion-key { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.25rem; }
    #fixator-motion-comparison .key-mark { display: inline-block; width: 1.3rem; height: 0.15rem; margin-right: 0.35rem; vertical-align: middle; }
    #fixator-motion-comparison .axial-key { background: var(--viz-series-1); }
    #fixator-motion-comparison .shear-key { background: var(--viz-series-2); }
  </style>
  <h3>Same axial load, different motion</h3>
  <div class="load-control">
    <div class="load-label">
      <label class="form-label" for="fixator-relative-load">Relative axial load</label>
      <output id="fixator-load-value" class="tabular-nums" for="fixator-relative-load">65%</output>
    </div>
    <input class="form-range" id="fixator-relative-load" type="range" min="0" max="100" value="65" aria-label="Relative axial load in this illustrative schematic">
  </div>
  <svg class="motion-drawing" role="img" aria-labelledby="fixator-motion-title fixator-motion-desc">
    <title id="fixator-motion-title">Axial gap closure and transverse shear with fine wires and half-pins</title>
    <desc id="fixator-motion-desc">A qualitative, exaggerated view of one frame-to-bone attachment. Fine wire is supported on both sides and permits mostly vertical fragment motion. A one-sided half-pin bends as a cantilever and can couple vertical motion to fragment tilt and sideways displacement. The lower fragment is a fixed reference.</desc>
    <g data-diagram></g>
  </svg>
  <div class="motion-key text-small">
    <span><span class="key-mark axial-key"></span>Axial gap closure</span>
    <span><span class="key-mark shear-key"></span>Sideways shift</span>
    <span class="text-muted">One attachment shown · motion exaggerated</span>
  </div>
  <script>
    (() => {
      const root = document.getElementById('fixator-motion-comparison');
      const slider = root.querySelector('#fixator-relative-load');
      const value = root.querySelector('#fixator-load-value');
      const svg = root.querySelector('.motion-drawing');
      const drawing = root.querySelector('[data-diagram]');
      const saved = window.openai?.widgetState;
      if (Number.isFinite(saved?.privateContent?.load)) slider.value = saved.privateContent.load;

      const label = (x, y, text, cls = '', anchor = 'start') => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${text}</text>`;
      const arrow = (x1, y1, x2, y2, cls, both = false) => {
        const dx = x2 - x1, dy = y2 - y1, length = Math.hypot(dx, dy);
        if (length < 2) return '';
        const ux = dx / length, uy = dy / length, a = Math.min(6, length / 3);
        const head = (x, y, sign) => `M ${x - sign * ux * a - uy * a * 0.5} ${y - sign * uy * a + ux * a * 0.5} L ${x} ${y} L ${x - sign * ux * a + uy * a * 0.5} ${y - sign * uy * a - ux * a * 0.5}`;
        return `<path class="${cls}" d="M ${x1} ${y1} L ${x2} ${y2} ${head(x2, y2, 1)} ${both ? head(x1, y1, -1) : ''}" />`;
      };

      function panel(width, offsetX, offsetY, pin, fraction) {
        const xL = 0.1 * width, xR = 0.94 * width, xC = (xL + xR) / 2;
        const attachY = 132, boneTop = 65, fractureY = 215, lowerTop = 284;
        const boneWidth = 42, span = xC - xL;
        const wireDrop = 38 * Math.pow(fraction, 0.7);
        const pinDrop = 23 * fraction;
        const drop = pin ? pinDrop : wireDrop;
        const theta = pin ? Math.atan(1.5 * pinDrop / span) : 0;
        const degrees = theta * 180 / Math.PI;
        const arm = fractureY - attachY;
        const endX = xC - arm * Math.sin(theta);
        const endY = attachY + drop + arm * Math.cos(theta);
        const topX = xC + (attachY - boneTop) * Math.sin(theta);
        const topY = attachY + drop - (attachY - boneTop) * Math.cos(theta);
        let markup = `<g transform="translate(${offsetX},${offsetY})">`;
        markup += label(12, 20, pin ? 'Half-pin' : 'Tensioned fine wire', 'panel-title');
        markup += label(12, 43, pin ? 'Clamped on one side' : 'Supported on both sides', 'secondary-label');
        markup += '<g transform="translate(0,55)">';
        markup += `<line class="reference" x1="${xC}" y1="50" x2="${xC}" y2="332" />`;
        markup += `<line class="reference" x1="${xC - 43}" y1="${fractureY}" x2="${xC + 43}" y2="${fractureY}" />`;
        markup += `<rect class="bone" x="${xC - boneWidth / 2}" y="${lowerTop}" width="${boneWidth}" height="55" rx="4" />`;
        markup += label(xC, 360, 'Lower-fragment reference', 'secondary-label', 'middle');
        markup += `<path class="structure" d="M ${xL - 8} 101 L ${xL - 8} 170 M ${xL - 8} ${attachY} L ${xL + 4} ${attachY}" />`;
        if (!pin) markup += `<path class="structure" d="M ${xR + 8} 101 L ${xR + 8} 170 M ${xR - 4} ${attachY} L ${xR + 8} ${attachY}" />`;

        markup += `<g transform="translate(${xC},${attachY + drop}) rotate(${degrees})">`;
        markup += `<rect class="bone" x="${-boneWidth / 2}" y="${boneTop - attachY}" width="${boneWidth}" height="${fractureY - boneTop}" rx="4" />`;
        markup += '</g>';

        if (pin) {
          const pts = [];
          for (let i = 0; i <= 25; i++) {
            const t = i / 25;
            pts.push(`${i ? 'L' : 'M'} ${xL + span * t} ${attachY + pinDrop * (3 * t * t - t * t * t) / 2}`);
          }
          markup += `<path class="pin" d="${pts.join(' ')}" />`;
          markup += label(xL + 15, 105, 'Cantilever', 'secondary-label');
        } else {
          markup += `<path class="wire" d="M ${xL} ${attachY} L ${xC - boneWidth / 2} ${attachY + drop} L ${xC + boneWidth / 2} ${attachY + drop} L ${xR} ${attachY}" />`;
          markup += label(xL + 8, 105, 'Tension', 'secondary-label');
          markup += label(xR - 8, 105, 'Tension', 'secondary-label', 'end');
        }

        markup += arrow(topX, topY - 40, topX, topY - 5, 'force');
        markup += label(topX + 11, topY - 22, 'F');
        markup += arrow(xC + 43, fractureY, xC + 43, endY, 'axial', true);
        if (fraction > 0.03) {
          markup += label(xC + 54, (fractureY + endY) / 2 + 5, pin ? 'Less' : 'More');
          if (pin) {
            markup += `<line class="reference" x1="${endX}" y1="${endY}" x2="${endX}" y2="266" />`;
            markup += arrow(endX, 262, xC, 262, 'shear', true);
            markup += label(xC - 4, 282, 'Shift', '', 'end');
          } else {
            markup += label(xC, 264, 'Aligned', 'secondary-label', 'middle');
          }
        }
        markup += '</g></g>';
        return markup;
      }

      function draw() {
        const width = Math.max(1, root.getBoundingClientRect().width);
        const stacked = width < 660;
        const panelWidth = stacked ? width : width / 2;
        const height = stacked ? 846 : 423;
        const fraction = Math.max(0, Math.min(1, Number(slider.value) / 100));
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svg.setAttribute('height', height);
        drawing.innerHTML = panel(panelWidth, 0, 0, false, fraction) + panel(panelWidth, stacked ? 0 : panelWidth, stacked ? 423 : 0, true, fraction);
        value.value = `${slider.value}%`;
        value.textContent = `${slider.value}%`;
        slider.setAttribute('aria-valuetext', `${slider.value} percent relative load; illustrative, not a clinical prediction`);
      }

      slider.addEventListener('input', draw);
      slider.addEventListener('change', () => {
        window.openai?.setWidgetState({modelContent: {relativeLoad: Number(slider.value), view: 'fine-wire versus half-pin under axial load'}, privateContent: {load: Number(slider.value)}})?.catch(() => {});
      });
      window.addEventListener('openai:set_globals', event => {
        const load = event.detail?.globals?.widgetState?.privateContent?.load;
        if (Number.isFinite(load)) { slider.value = load; draw(); }
      });
      new ResizeObserver(draw).observe(root);
      draw();
    })();
  </script>
</div>
