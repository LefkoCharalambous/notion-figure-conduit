<div id="spinopelvic-geometry-20261102">
  <div class="viz-controls">
    <label class="form-label" for="pelvic-shape-20261102">Pelvic shape (PI)
      <select class="form-select" id="pelvic-shape-20261102" aria-label="Compare pelvis shapes by pelvic incidence">
        <option value="40">PI 40°</option>
        <option value="55" selected>PI 55°</option>
        <option value="70">PI 70°</option>
      </select>
    </label>
    <label class="form-label" for="pelvic-rotation-20261102">Backward rotation (PT): <output class="tabular-nums" id="pelvic-pt-value-20261102">15°</output>
      <input class="form-range" id="pelvic-rotation-20261102" type="range" min="0" max="35" value="15" step="1" aria-label="Pelvic tilt in degrees">
    </label>
  </div>
  <div class="pelvic-metrics viz-row tabular-nums" aria-live="polite" aria-atomic="true">
    <span><i class="pelvic-key pelvic-pi"></i>PI <output data-value="pi">55°</output></span>

  <div class="pelvic-drawing">
    <svg class="pelvic-svg" viewBox="0 0 736 400" role="img" aria-labelledby="pelvic-title-20261102 pelvic-desc-20261102">
      <title id="pelvic-title-20261102">Pelvic incidence, pelvic tilt, and sacral slope</title>
      <desc id="pelvic-desc-20261102">Side-view geometric model. The sacrum rotates around the hip axis. Pelvic incidence remains 55 degrees while pelvic tilt is 15 degrees and sacral slope is 40 degrees.</desc>
      <g data-geometry>
        <text x="18" y="25">← Posterior</text><text x="718" y="25" text-anchor="end">Anterior →</text>
        <line class="pelvic-reference" x1="397" y1="65" x2="397" y2="320" />
        <line class="pelvic-reference" x1="345" y1="97" x2="345" y2="245" />
        <line class="pelvic-reference" x1="345" y1="97" x2="500" y2="97" />
        <path class="pelvic-sacrum" d="M 302 61 L 388 133 L 293 158 Z" />
        <line class="pelvic-endplate" x1="302" y1="61" x2="388" y2="133" />
        <line class="pelvic-normal" x1="345" y1="97" x2="268" y2="189" />
        <line class="pelvic-hipline" x1="345" y1="97" x2="397" y2="290" />
        <path class="pelvic-angle pelvic-pi" d="M 362 161 A 66 66 0 0 1 303 148" />
        <path class="pelvic-angle pelvic-ss" d="M 389 97 A 44 44 0 0 1 379 125" />
        <path class="pelvic-angle pelvic-pt" d="M 386 248 A 44 44 0 0 1 397 246" />
        <circle class="pelvic-point" cx="345" cy="97" r="4" />
        <circle class="pelvic-hip" cx="397" cy="290" r="19" />
        <circle class="pelvic-point" cx="397" cy="290" r="3" />
        <text x="334" y="82" text-anchor="end">S</text>
        <text x="425" y="295">H</text>
        <text x="420" y="80">S1 endplate</text>
        <text x="324" y="189" text-anchor="middle">PI 55°</text>
        <text x="406" y="120">SS 40°</text>
        <text x="366" y="236" text-anchor="end">PT 15°</text>
        <text x="397" y="345" text-anchor="middle">Hip axis</text>
      </g>
    </svg>
  </div>
  <div class="pelvic-legend viz-row text-small">
    <span><i class="pelvic-line pelvic-solid"></i>S–H line</span>
    <span><i class="pelvic-line pelvic-dashed"></i>S1 perpendicular</span>
    <span><i class="pelvic-line pelvic-reference-key"></i>Vertical / horizontal</span>
  </div>
</div>
<style>
  #spinopelvic-geometry-20261102 { color:var(--foreground); max-width:736px; margin-inline:auto; }
  #spinopelvic-geometry-20261102 .pelvic-metrics { margin-block:16px 2px; gap:28px; }
  #spinopelvic-geometry-20261102 .pelvic-metrics span,
  #spinopelvic-geometry-20261102 .pelvic-legend span { display:inline-flex; align-items:center; gap:7px; }
  #spinopelvic-geometry-20261102 .pelvic-key { display:inline-block; width:14px; height:3px; background:currentColor; }
  #spinopelvic-geometry-20261102 .pelvic-pi { color:var(--viz-series-1); stroke:var(--viz-series-1); }
  #spinopelvic-geometry-20261102 .pelvic-pt { color:var(--viz-series-2); stroke:var(--viz-series-2); }
  #spinopelvic-geometry-20261102 .pelvic-ss { color:var(--viz-series-3); stroke:var(--viz-series-3); }
  #spinopelvic-geometry-20261102 .pelvic-svg { display:block; width:100%; height:auto; overflow:visible; }
  #spinopelvic-geometry-20261102 .pelvic-svg text { fill:var(--foreground); font:inherit; }
  #spinopelvic-geometry-20261102 .pelvic-reference { stroke:var(--muted-foreground); stroke-width:1; stroke-dasharray:3 5; opacity:.65; }
  #spinopelvic-geometry-20261102 .pelvic-sacrum { fill:var(--muted); stroke:var(--border); stroke-width:1; }
  #spinopelvic-geometry-20261102 .pelvic-endplate { stroke:var(--foreground); stroke-width:3; stroke-linecap:round; }
  #spinopelvic-geometry-20261102 .pelvic-normal { stroke:var(--foreground); stroke-width:1.5; stroke-dasharray:7 4; }
  #spinopelvic-geometry-20261102 .pelvic-hipline { stroke:var(--foreground); stroke-width:1.5; }
  #spinopelvic-geometry-20261102 .pelvic-angle { fill:none; stroke-width:3; }
  #spinopelvic-geometry-20261102 .pelvic-point { fill:var(--foreground); }
  #spinopelvic-geometry-20261102 .pelvic-hip { fill:var(--background); stroke:var(--foreground); stroke-width:1.5; }
  #spinopelvic-geometry-20261102 .pelvic-legend { gap:14px; }
  #spinopelvic-geometry-20261102 .pelvic-line { display:inline-block; width:24px; height:0; border-top:1.5px solid var(--foreground); }
  #spinopelvic-geometry-20261102 .pelvic-dashed { border-top-style:dashed; }
  #spinopelvic-geometry-20261102 .pelvic-reference-key { border-top:1px dotted var(--muted-foreground); }
</style>
<script>
(() => {
  const root = document.getElementById('spinopelvic-geometry-20261102');
  if (!root) return;
  const shape = root.querySelector('#pelvic-shape-20261102');
  const rotation = root.querySelector('#pelvic-rotation-20261102');
  const outputPT = root.querySelector('#pelvic-pt-value-20261102');
  const svg = root.querySelector('.pelvic-svg');
  const geometry = root.querySelector('[data-geometry]');
  const description = root.querySelector('#pelvic-desc-20261102');
  const ns = 'http://www.w3.org/2000/svg';
  const rad = Math.PI / 180;
  let state = { pi:55, pt:15 };
  let shown = { ...state };
  let animation = 0;
  function valid(saved) {
    return saved && [40,55,70].includes(Number(saved.pi)) &&
      Number.isFinite(Number(saved.pt)) && Number(saved.pt) >= 0 && Number(saved.pt) <= 35;
  }
  function node(tag, attributes, text) {
    const element = document.createElementNS(ns, tag);
    for (const [key,value] of Object.entries(attributes)) element.setAttribute(key,String(value));
    if (text !== undefined) element.textContent = text;
    geometry.appendChild(element);
    return element;
  }
  function line(a,b,kind) { return node('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:kind}); }
  function point(c,r,a) { return {x:c.x+r*Math.cos(a*rad),y:c.y+r*Math.sin(a*rad)}; }
  function arc(c,r,a,b,kind) {
    if (Math.abs(a-b)<0.01) return;
    const p=point(c,r,a),q=point(c,r,b);
    node('path',{d:`M ${p.x} ${p.y} A ${r} ${r} 0 0 1 ${q.x} ${q.y}`,class:`pelvic-angle ${kind}`});
  }
  function label(x,y,text,anchor='start') { return node('text',{x,y,'text-anchor':anchor},text); }
  function draw(values) {
    const width = Math.max(280,root.querySelector('.pelvic-drawing').getBoundingClientRect().width);
    const narrow = width < 440;
    const length = Math.min(200,(width-88)/1.48);
    const hip = {x:width*0.54,y:100+length};
    const s = {x:hip.x-length*Math.sin(values.pt*rad),y:hip.y-length*Math.cos(values.pt*rad)};
    const slope = values.pi-values.pt;
    const tangent = {x:Math.cos(slope*rad),y:Math.sin(slope*rad)};
    const normal = {x:-Math.sin(slope*rad),y:Math.cos(slope*rad)};
    const half = length*0.28;
    const back = {x:s.x-half*tangent.x,y:s.y-half*tangent.y};
    const front = {x:s.x+half*tangent.x,y:s.y+half*tangent.y};
    const tip = {x:s.x+length*0.43*normal.x,y:s.y+length*0.43*normal.y};
    svg.setAttribute('viewBox',`0 0 ${width} ${hip.y+72}`);
    geometry.replaceChildren();
    label(12,25,'← Posterior'); label(width-12,25,'Anterior →','end');
    line({x:hip.x,y:66},{x:hip.x,y:hip.y+26},'pelvic-reference');
    line(s,{x:s.x,y:s.y+length*.75},'pelvic-reference');
    line(s,{x:Math.min(width-16,s.x+length*.75),y:s.y},'pelvic-reference');
    node('path',{d:`M ${back.x} ${back.y} L ${front.x} ${front.y} L ${tip.x} ${tip.y} Z`,class:'pelvic-sacrum'});
    line(back,front,'pelvic-endplate');
    line(s,{x:s.x+normal.x*length*.64,y:s.y+normal.y*length*.64},'pelvic-normal');
    const squareSize=10;
    node('path',{d:`M ${s.x+tangent.x*squareSize} ${s.y+tangent.y*squareSize} l ${normal.x*squareSize} ${normal.y*squareSize} l ${-tangent.x*squareSize} ${-tangent.y*squareSize}`,fill:'none',stroke:'var(--muted-foreground)','stroke-width':1});
    line(s,hip,'pelvic-hipline');
    arc(s,length*.34,90-values.pt,90+slope,'pelvic-pi');
    arc(s,length*.22,0,slope,'pelvic-ss');
    arc(hip,length*.23,-90-values.pt,-90,'pelvic-pt');
    node('circle',{cx:s.x,cy:s.y,r:4,class:'pelvic-point'});
    node('circle',{cx:hip.x,cy:hip.y,r:18,class:'pelvic-hip'});
    node('circle',{cx:hip.x,cy:hip.y,r:3,class:'pelvic-point'});
    label(s.x-9,s.y-12,'S','end');
    label(hip.x+26,hip.y+5,'H');
    label(width-18,60,'S1 endplate','end');
    line({x:width-65,y:65},{x:front.x,y:front.y-4},'pelvic-reference');
    const piMid=90+(slope-values.pt)/2;
    const piLabel=point(s,length*.49,piMid);
    label(piLabel.x-2,piLabel.y+6,`PI ${Math.round(values.pi)}°`,'middle');
    const ssLabel=point(s,length*.41,Math.min(slope/2,25));
    label(ssLabel.x+6,ssLabel.y+5,`SS ${Math.round(slope)}°`);
    label(hip.x+25,hip.y-42,`PT ${Math.round(values.pt)}°`);
    label(hip.x,hip.y+51,'Hip axis','middle');
    if (!narrow) label(hip.x,53,'Vertical','middle');
  }
  function update(animate) {
    shape.value=String(state.pi); rotation.value=String(state.pt);
    outputPT.textContent=`${state.pt}°`;
    for (const key of ['pi','pt','ss']) {
      root.querySelector(`[data-value="${key}"]`).textContent=`${key==='ss' ? state.pi-state.pt : state[key]}°`;
    }
    description.textContent=`Side-view geometric model. Pelvic incidence ${state.pi} degrees; pelvic tilt ${state.pt} degrees; sacral slope ${state.pi-state.pt} degrees. H is the hip axis and S is the midpoint of the S1 endplate. Incidence is unchanged by rotation of this pelvis.`;
    cancelAnimationFrame(animation);
    if (!animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      shown={...state}; draw(shown); return;
    }
    const start={...shown},target={...state},time=performance.now();
    function step(now) {
      const t=Math.min(1,(now-time)/220),e=1-Math.pow(1-t,3);
      shown={pi:start.pi+(target.pi-start.pi)*e,pt:start.pt+(target.pt-start.pt)*e};
      draw(shown);
      if (t<1) animation=requestAnimationFrame(step);
    }
    animation=requestAnimationFrame(step);
  }
  function remember() {
    if (window.openai && typeof window.openai.setWidgetState==='function') {
      const result=window.openai.setWidgetState({modelContent:{pi:state.pi,pt:state.pt},privateContent:null});
      if (result && typeof result.catch==='function') result.catch(()=>{});
    }
  }
  const saved=window.openai && window.openai.widgetState && window.openai.widgetState.modelContent;
  if (valid(saved)) state={pi:Number(saved.pi),pt:Number(saved.pt)};
  shape.addEventListener('change',()=>{state.pi=Number(shape.value);update(true);remember();});
  rotation.addEventListener('input',()=>{state.pt=Number(rotation.value);update(false);});
  rotation.addEventListener('change',remember);
  window.addEventListener('openai:set_globals',event=>{
    const next=event.detail && event.detail.globals && event.detail.globals.widgetState;
    if (valid(next && next.modelContent)) {
      state={pi:Number(next.modelContent.pi),pt:Number(next.modelContent.pt)};update(false);
    }
  });
  new ResizeObserver(()=>draw(shown)).observe(root.querySelector('.pelvic-drawing'));
  update(false);
})();
</script>
