<div id="lunate-balance-explainer">
  <style>
    #lunate-balance-explainer { color: var(--foreground); max-width: 736px; }
    #lunate-balance-explainer .state-label { margin: 12px 0 4px; min-height: 2.5em; }
    #lunate-balance-explainer .bone-view { width: 100%; display: block; overflow: visible; }
    #lunate-balance-explainer .bone-view text { fill: var(--foreground); font-family: inherit; }
    #lunate-balance-explainer .bone { fill: var(--muted); stroke: var(--muted-foreground); stroke-width: 1.5; }
    #lunate-balance-explainer .lunate { fill: color-mix(in srgb, var(--viz-series-1) 20%, var(--background)); stroke: var(--viz-series-1); stroke-width: 2; }
    #lunate-balance-explainer .connection { stroke: var(--muted-foreground); stroke-width: 4; stroke-linecap: round; }
    #lunate-balance-explainer .rupture { stroke: var(--viz-series-3); stroke-width: 3; fill: none; }
    #lunate-balance-explainer .guide { stroke: var(--muted-foreground); stroke-width: 1; stroke-dasharray: 4 5; fill: none; opacity: .65; }
    #lunate-balance-explainer .axis { stroke: var(--viz-series-1); stroke-width: 2.5; fill: none; }
    #lunate-balance-explainer .arrowhead { fill: var(--viz-series-1); }
    #lunate-balance-explainer .quiet { opacity: .8; }
  </style>
  <h3>Lunate balance</h3>
  <div class="viz-controls" role="group" aria-label="Carpal connections">
    <button type="button" class="btn" data-state="normal" aria-pressed="true">Intact</button>
    <button type="button" class="btn" data-state="disi" aria-pressed="false">SL tear → DISI</button>
    <button type="button" class="btn" data-state="visi" aria-pressed="false">LT tear → VISI</button>
  </div>
  <div class="state-label" aria-live="polite"></div>
  <svg class="bone-view connection-view" role="img" aria-label="Connection map of the scaphoid, lunate, and triquetrum"></svg>
  <svg class="bone-view lateral-view" role="img" aria-label="Lateral schematic showing the direction the lunate cup faces"></svg>
  <div class="text-small text-muted">Simplified passive mechanics. Tilt is exaggerated; shapes and angles are not measurements.</div>
  <script>
  (() => {
    const root = document.getElementById('lunate-balance-explainer');
    const connection = root.querySelector('.connection-view');
    const lateral = root.querySelector('.lateral-view');
    const detail = root.querySelector('.state-label');
    const buttons = Array.from(root.querySelectorAll('button[data-state]'));
    const states = {
      normal: {angle:0, label:'Both links intact → balanced lunate', follow:'Balanced', cup:'Cup faces toward the fingers'},
      disi: {angle:32, label:'SL link lost → lunate follows the triquetrum into extension', follow:'Follows triquetrum', cup:'Cup tilts toward the BACK of the hand'},
      visi: {angle:-32, label:'LT link lost → lunate follows the scaphoid into flexion', follow:'Follows scaphoid', cup:'Cup tilts toward the PALM'}
    };
    const saved = window.openai?.widgetState?.modelContent?.pattern;
    let selected = Object.prototype.hasOwnProperty.call(states, saved) ? saved : 'normal';
    let angle = states[selected].angle;
    let frame = 0;
    let width = 600;
    const esc = x => String(x).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
    const label = (x,y,t,anchor='middle',cls='') => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}">${esc(t)}</text>`;
    const rotate = (x,y,a) => {const r=a*Math.PI/180; return [x*Math.cos(r)-y*Math.sin(r),x*Math.sin(r)+y*Math.cos(r)];};
    function link(x1,x2,y,name,broken) {
      const m=(x1+x2)/2;
      if (!broken) return `<line class="connection" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>${label(m,y-34,name,'middle','text-small')}`;
      return `<line class="connection" x1="${x1}" y1="${y}" x2="${m-12}" y2="${y}"/><line class="connection" x1="${m+12}" y1="${y}" x2="${x2}" y2="${y}"/><path class="rupture" d="M${m-5},${y-8} l8,5 -7,6 8,5"/>${label(m,y-34,name+' torn','middle','text-small')}`;
    }
    function draw() {
      width=Math.max(288,Math.round(root.getBoundingClientRect().width));
      const cx=width/2;
      const xs=[Math.max(48,width*.16),cx,Math.min(width-48,width*.84)];
      const radius=width<400?34:40;
      connection.setAttribute('viewBox',`0 0 ${width} 215`);
      connection.setAttribute('height','215');
      connection.innerHTML=`<title>Which connection remains?</title><desc>Scaphoid has a flexion tendency. Triquetrum has an extension tendency. The lunate follows the remaining intact connection when the other link and supporting restraints fail.</desc>
        ${label(0,18,'1. Connection map','start')}
        ${label(xs[0],49,'Scaphoid')}${label(xs[1],49,'Lunate')}${label(xs[2],49,'Triquetrum')}
        ${label(xs[0],72,'Flexion tendency','middle','text-small')}${label(xs[2],72,'Extension tendency','middle','text-small')}
        ${link(xs[0]+radius,xs[1]-radius,120,'SL',selected==='disi')}
        ${link(xs[1]+radius,xs[2]-radius,120,'LT',selected==='visi')}
        <ellipse class="bone" cx="${xs[0]}" cy="120" rx="${radius}" ry="30"/>
        <ellipse class="lunate" cx="${xs[1]}" cy="120" rx="${radius}" ry="30"/>
        <ellipse class="bone" cx="${xs[2]}" cy="120" rx="${radius}" ry="30"/>
        ${label(xs[0],125,'S')}${label(xs[1],125,'L')}${label(xs[2],125,'T')}
        ${label(cx,179,states[selected].follow,'middle')}
        ${label(cx,201,'Connection map, not an X-ray','middle','text-small quiet')}`;
      lateral.setAttribute('viewBox',`0 0 ${width} 372`);
      lateral.setAttribute('height','372');
      const ly=216,capAngle=-angle*.55;
      const [dx,dy]=rotate(0,-25,angle);
      const [ax,ay]=rotate(0,-80,angle);
      const stateTitle=selected==='normal'?'Neutral lunate':selected==='disi'?'DISI: lunate EXTENSION':'VISI: lunate FLEXION';
      lateral.setAttribute('aria-label',`${stateTitle}. ${states[selected].cup}. Palm is left and back of hand is right.`);
      lateral.innerHTML=`<title>${esc(stateTitle)}</title><desc>Palm is on the left. Back of hand is on the right. Radius is below the lunate; capitate is above. The highlighted arrow points out of the lunate's distal cup. The capitate can angulate in the opposite direction as compensation.</desc>
        ${label(0,20,'2. Side view — watch the lunate cup','start')}
        ${label(cx,47,'FINGERS ↑','middle','text-small')}
        ${label(4,80,'PALM ←','start','text-small')}${label(width-4,80,'→ BACK OF HAND','end','text-small')}
        <line class="guide" x1="${cx}" y1="94" x2="${cx}" y2="329"/>
        <g transform="translate(${cx},${ly+48})"><path class="bone" d="M-36,58 L-45,-8 Q-39,-17 -30,-7 Q0,13 30,-7 Q39,-17 45,-8 L36,58 Z"/></g>
        <g transform="translate(${cx+dx},${ly+dy}) rotate(${capAngle})"><path class="bone" d="M-17,-75 L17,-75 L24,-10 C34,25 -34,25 -24,-10 Z"/><line class="guide" x1="0" y1="-68" x2="0" y2="11"/></g>
        <g transform="translate(${cx},${ly}) rotate(${angle})"><path class="lunate" d="M-36,-18 Q0,13 36,-18 C45,7 27,36 0,36 C-27,36 -45,7 -36,-18 Z"/><path class="axis" d="M0,12 L0,-80"/><path class="arrowhead" d="M0,-87 L-5,-76 L5,-76 Z"/></g>
        ${label(cx,ly+23,'Lunate')}
        ${label(cx+62,125,'Capitate','start','text-small')}
        ${label(cx+57,298,'Radius','start','text-small')}
        ${label(cx,339,stateTitle)}
        ${label(cx,359,states[selected].cup,'middle','text-small')}`;
    }
    function sync() {
      for (const button of buttons) button.setAttribute('aria-pressed',String(button.dataset.state===selected));
      detail.textContent=states[selected].label;
    }
    function choose(next,persist=true) {
      if (!Object.prototype.hasOwnProperty.call(states,next)) return;
      const from=angle,to=states[next].angle;
      selected=next;
      sync();
      cancelAnimationFrame(frame);
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {angle=to;draw();}
      else {
        const started=performance.now();
        const step=now=>{const t=Math.min(1,(now-started)/380);const eased=t*t*(3-2*t);angle=from+(to-from)*eased;draw();if(t<1)frame=requestAnimationFrame(step);};
        frame=requestAnimationFrame(step);
      }
      if (persist && window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{pattern:selected},privateContent:null}).catch(()=>{});
    }
    for (const button of buttons) button.addEventListener('click',()=>choose(button.dataset.state));
    window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.modelContent?.pattern;if(next && next!==selected)choose(next,false);});
    new ResizeObserver(draw).observe(root);
    sync();draw();
  })();
  </script>
</div>
