name: Reconstruct temporary SI L5 figure

on:
  push:
    branches: [main]
    paths:
      - 'tmp/reconstruct-si-l5/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact PNG and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/2026-08-14-Q8-50
          cat tmp/reconstruct-si-l5/chunk-* > tmp/2026-08-14-Q8-50/si-l5-anatomy-correct-312486f0.png
          test "$(sha256sum tmp/2026-08-14-Q8-50/si-l5-anatomy-correct-312486f0.png | awk '{print $1}')" = "312486f04aa66ae575b4d7a5398007c7d8ce23cc111712aa6f159733e806c639"
          rm -rf tmp/reconstruct-si-l5
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/2026-08-14-Q8-50/si-l5-anatomy-correct-312486f0.png tmp/reconstruct-si-l5
          git commit -m "Reconstruct exact SI L5 screenshot for Notion transit"
          git push
